<script src="app.js?v=14"></script><script>
(() => {
  // All supplied tutorial PNGs have their NEXT/START button centered at
  // approximately (931, 1461) in image coordinates.  Align that point,
  // not the full PNG bounds.  This keeps page 2 stable even though its
  // white return arrow extends farther to the right.
  const BUTTON_X = 931;
  const BUTTON_Y = 1461;
  const NATIVE_H = 1558;

  function layoutTutorial(){
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    // Match the PowerPoint reference: generous red margin around the artwork.
    // Same scale on all three pages.
    const maxNativeW = 2021;
    const scale = Math.min((vh * 0.76) / NATIVE_H, (vw * 0.88) / maxNativeW);

    // Keep NEXT / START at exactly the same screen position on every page.
    const anchorX = vw * 0.50;
    const anchorY = vh * 0.85;

    document.querySelectorAll('.tutorial-frame').forEach(frame => {
      const nw = Number(frame.dataset.nativeW);
      const nh = Number(frame.dataset.nativeH);
      frame.style.width = `${nw * scale}px`;
      frame.style.height = `${nh * scale}px`;
      frame.style.left = `${anchorX - BUTTON_X * scale}px`;
      frame.style.top = `${anchorY - BUTTON_Y * scale}px`;
      frame.style.setProperty('--tutorial-scale', scale);
    });
  }
  window.addEventListener('resize', layoutTutorial);
  document.addEventListener('DOMContentLoaded', layoutTutorial);
  layoutTutorial();
})();
</script><script>(()=>{const t=document.getElementById('tutorial'),p=[...t.querySelectorAll('.tutorial-page')];let i=0;const show=n=>{i=n;p.forEach((x,j)=>x.classList.toggle('active',j===n))};t.querySelectorAll('.tutorial-next:not(.tutorial-start)').forEach(b=>b.onclick=()=>show(Math.min(i+1,p.length-1)));document.getElementById('tutorialStart').onclick=()=>{const bgm=document.getElementById('shopBgm');const toggle=document.getElementById('bgmToggle');if(bgm&&(!toggle||toggle.getAttribute('aria-pressed')!=='false')){bgm.currentTime=0;bgm.volume=.275;bgm.play().catch(()=>{});}t.classList.add('leaving');document.body.classList.remove('tutorial-open');setTimeout(()=>t.remove(),360)}})();</script>
<script>(()=>{const btn=document.getElementById('bgmToggle'),bgm=document.getElementById('shopBgm');if(!btn||!bgm)return;let enabled=true;const render=()=>{btn.textContent=enabled?'♪ BGM ON':'♪ BGM OFF';btn.setAttribute('aria-pressed',enabled?'true':'false');btn.setAttribute('aria-label',enabled?'BGMをオフにする':'BGMをオンにする')};btn.addEventListener('click',()=>{enabled=!enabled;render();if(enabled){bgm.volume=.275;bgm.play().catch(()=>{})}else bgm.pause()});render()})();</script>
